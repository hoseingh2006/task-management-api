<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1>Welcome Back</h1>
            <p class="subtitle">Sign in to your account</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input class="form-control" type="text" id="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input class="form-control" type="password" id="password" required autocomplete="current-password">
                </div>
                <button class="btn btn-primary btn-block" type="submit" id="loginBtn">Sign In</button>
            </form>
            <p style="text-align:center;margin-top:20px;font-size:14px;color:var(--gray-500);">
                Don't have an account? <a href="register.html">Create one</a>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
