services:
  migrate:
    build: ./backend
    command: alembic upgrade head
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - Taskmanager
  db:
    container_name: db
    image: postgres:latest
    volumes:
      - postgres-data:/var/lib/postgresql
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - Taskmanager
  backend1:
    build: ./backend
    depends_on:
      migrate:
        condition: service_completed_successfully

    env_file:
      - ./backend/.env
    networks:
      - Taskmanager
  backend2:
    build: ./backend
    depends_on:
      migrate:
        condition: service_completed_successfully

    env_file:
      - ./backend/.env
    networks:
      - Taskmanager
  backend3:
    build: ./backend
    depends_on:
      migrate:
        condition: service_completed_successfully

    env_file:
      - ./backend/.env
    networks:
      - Taskmanager
  nginx:
    container_name: nginx
    build: .
    ports:
      - "80:80"
      - "443:443"
    networks:
      - Taskmanager
    depends_on:
      - backend1
    volumes:
      - ./certs:/etc/nginx/certs:ro

networks:
  Taskmanager:
volumes:
  postgres-data:
